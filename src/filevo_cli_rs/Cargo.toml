[package]
name = "filevo-cli"
version = "2.0.0"
edition = "2024"
description = "Filevo conversational document intelligence terminal interface"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
filevo-core = { path = "../../crates/filevo-core" }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
unicode-width = "0.2"
