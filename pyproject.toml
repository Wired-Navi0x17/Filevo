[project]
name = "cie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wired-Navi0x17", email = "harshulkala14@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "customtkinter>=6.0.0",
    "fastapi>=0.144.0",
    "jinja2>=3.1.6",
    "pymupdf>=1.28.2",
    "pyside6>=6.12.0",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pywebview>=6.2.1",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
cie = "cie:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
